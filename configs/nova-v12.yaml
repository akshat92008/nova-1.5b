schema_version: nova.training-config.v1

# A real foundation.lock.json generated by `python -m nova_v12.foundation`
# supplies the exact model id and immutable revision. No base is hard-coded here.
foundation:
  trust_remote_code: false

data:
  # Pilot gates. Raise to 5,000 verified patches and 2,000 ranked pairs before
  # calling any checkpoint a release candidate.
  minimum_verified_examples: 100
  minimum_preference_pairs: 100
  preference_dir: artifacts/data/preferences

training:
  method: qlora_then_dpo
  max_length: 4096
  seed: 42
  sft:
    learning_rate: 0.0001
    epochs: 2
    lora_rank: 32
    lora_alpha: 64
  dpo:
    learning_rate: 0.00001
    beta: 0.1
    epochs: 1

release:
  minimum_held_out_tasks: 1000
  minimum_valid_protocol_rate: 0.99
  minimum_patch_application_rate: 0.97
  minimum_first_attempt_success_rate: 0.70
  minimum_atomic_task_success_rate: 0.80
  required_scope_compliance_rate: 1.0
  maximum_q4_success_regression: 0.02
  maximum_peak_m3_memory_gb: 7.2
  minimum_m3_tokens_per_second: 25
