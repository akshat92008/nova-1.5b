[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-code"
version = "12.0.0.dev0"
description = "Verified local atomic coding worker and model-development toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Amaura Labs"}]
license = {text = "MIT"}
keywords = ["llm", "code", "local", "inference", "fine-tuning"]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
data = [
  "datasets>=2.18",
  "transformers>=4.45,<6",
  "tokenizers>=0.15",
  "datasketch>=1.6",
  "tree-sitter>=0.22",
  "tree-sitter-language-pack>=0.6",
]
train = [
  "torch>=2.7,<3",
  "transformers>=4.50,<6",
  "datasets>=4,<5",
  "accelerate>=1.6,<2",
  "peft>=0.17,<1",
  "trl>=0.25,<1",
  "bitsandbytes>=0.46,<1",
  "safetensors>=0.5,<1",
]
eval = [
  "transformers>=4.45,<6",
  "torch>=2.1,<3",
  "evalplus>=0.2",
]
inference = ["transformers>=4.45,<6", "torch>=2.1,<3"]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
]
all = ["nova-code[data,train,eval,inference,dev]"]

[project.scripts]
nova-v12 = "nova_v12.cli:main"
nova-v12-data = "nova_v12.dataset:main"
nova-v12-eval = "nova_v12.evaluation:main"
nova-v12-foundation = "nova_v12.foundation:main"
nova-v12-preferences = "nova_v12.preference:main"
nova-v12-train = "nova_v12.release_training:main"
nova-v12-cpt = "nova_v12.training.stage1_cpt:main"
nova-v12-sft = "nova_v12.training.stage2_sft:main"
nova-v12-distill = "nova_v12.training.stage3_distill:main"
nova-v12-dpo = "nova_v12.training.stage4_dpo:main"
nova-v12-export = "nova_v12.training.export:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nova_v12*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
