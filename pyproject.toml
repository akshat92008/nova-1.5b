[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-code"
version = "12.0.0-dev"
description = "Amaura Nova Code — Local-first coding model family"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Amaura Labs"},
]
keywords = ["llm", "code", "local", "inference", "fine-tuning"]

dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
nova-v12 = "nova_v12.cli:main"
nova-v12-data = "nova_v12.dataset:main"
nova-v12-eval = "nova_v12.evaluation:main"
nova-v12-foundation = "nova_v12.foundation:main"
nova-v12-preferences = "nova_v12.preference:main"
nova-v12-train = "nova_v12.training:main"

[project.optional-dependencies]
# Data pipeline
data = [
    "datasets>=2.18",
    "tokenizers>=0.15",
    "datasketch>=1.6",          # MinHash deduplication
]

# Training
train = [
    "torch>=2.7,<3",
    "transformers>=5,<6",
    "peft>=0.17,<1",
    "trl>=0.25,<1",
    "accelerate>=1.6,<2",
    "bitsandbytes>=0.46,<1",
    "datasets>=4,<5",
    "safetensors>=0.5,<1",
]

# Evaluation
eval = [
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.18",
    "evalplus>=0.2",             # HumanEval+/MBPP+
]

# Inference
inference = [
    "transformers>=4.40",
    "torch>=2.1",
]

# Development
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
]

# All dependencies
all = [
    "nova-code[data,train,eval,inference,dev]",
]

[tool.setuptools.packages.find]
include = ["nova_v12*", "data*", "training*", "eval*", "inference*", "bakeoff*", "nexus*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
