name: Nova V12 CI

on:
  push:
    branches: ["main", "dev", "agent/**"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Static checks
        run: |
          ruff check src/nova_v12 tests \
            legacy/v11/coding_agent/nexus/nova_v12_backend.py
          python -m compileall -q src/nova_v12

      - name: Unit and integration tests
        run: pytest --cov=nova_v12 --cov-report=term-missing --cov-fail-under=84

      - name: CLI smoke test
        run: |
          nova-v12 --help
          nova-v12-data --help
          nova-v12-eval --help
          nova-v12-foundation --help
          nova-v12-preferences --help
          nova-v12-train --help
          nova-v12-cpt --help
          nova-v12-sft --help
          nova-v12-distill --help
          nova-v12-dpo --help
          nova-v12-export --help
